services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kitty}:${POSTGRES_PASSWORD:-kitty_local}@db:5432/${POSTGRES_DB:-kitty}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitty_local}
      POSTGRES_DB: ${POSTGRES_DB:-kitty}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kitty_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  kitty_postgres:
