services:
  web:
    build:
      context: .
      target: web
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kitty}:${POSTGRES_PASSWORD:-kitty_local}@db:5432/${POSTGRES_DB:-kitty}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitty_local}
      POSTGRES_DB: ${POSTGRES_DB:-kitty}
    volumes:
      - kitty_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  kitty_postgres:
